<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div class="buttons">
        <input type="number" name="limit" id="limit_number">
        <button class="btn1">Parādīt GIF</button>
        <button class="btn2">Parādīt Stickers</button>
    </div>
    <div class="gallery">

    </div>






    <script>
        let valoda = "lv";

        fetch('dati.json')
            .then((data) => { return data.json() })
            .then((data) => { showData(data) })
            .then(() => getPosts())




        function showData(data) {
            document.body.innerHTML += `
                    <h1>${data.lv.sec1.title}</h1>
                `
        }


        function getPosts() {
            fetch('https://dummyjson.com/posts')
                .then(res => res.json())
                .then(data => {
                    data.posts.forEach((item, i) => {
                        document.body.innerHTML += `
                            <div>
                                <h3>${item.title}</h3>
                                <p>${item.body}</p>
                            </div>    
                        `
                    })


                });
        }

         adrese = "https://api.giphy.com/v1/gifs/trending";
         adrese2 = "https://api.giphy.com/v1/stickers/trending";

        


        function loadImages(address,limit) {
            gallery = document.querySelector('.gallery');

            const giphyKey = "vJ9oqLeP4HeA8Upou4kD6z7FOY9VRs7H";
           

            fetch(`${address}?api_key=${giphyKey}&limit=${limit}`, {
                method: "GET"
            })
                .then(resp => resp.json())
                .then(data => {
                    data.data.map((item) => {
                        gallery.innerHTML += `
                    <img src="${item.images.downsized.url}" alt="${item.title}" width="100px">
                `
                    })
                })
        }






    </script>
</body>

</html>
